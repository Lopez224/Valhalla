 <header class="fighters-header">

        <div class="container">

            <h1>HALL OF FIGHTERS</h1>

            <p>Conoce a los guerreros que forman parte de Valhalla</p>

        </div>

    </header>


    <!-- BUSCADOR -->
    <main class="container my-5">

        <div class="fighters-toolbar">

            <div class="total-fighters">
                <span id="totalFighters">0</span> PELEADORES
            </div>

            <div class="search">
                <input
                    type="text"
                    id="searchFighter"
                    placeholder="Buscar por nombre, apodo o record..."
                >
            </div>
        </div>
        <!-- GALERÍA -->
        <section class="view-fighters">

            <ul class="fighters-list" id="fightersList">
                <!-- JavaScript generará las tarjetas aquí -->
            </ul>

            <p id="emptyMessage" class="empty-message" hidden>
                No se encontraron peleadores.
            </p>

            <p id="loadingMessage" class="empty-message">
                Cargando peleadores...
            </p>

        </section>

    </main>
