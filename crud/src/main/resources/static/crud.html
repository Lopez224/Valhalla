<body>
<!-- Navigation-->

        <div class="container px-4 px-lg-5">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#!">About</a></li>

                        <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Fighters</a>

<div class="container">

    <img src="images/valhalla.jpg"
         alt="Valhalla"
         class="logo"
         width="600">

    <h1>Datos del peleador</h1>

    <!-- Formulario de registro y edición -->

    <form id="fighterForm">

        <input type="hidden" id="fighterId">

        <div class="form-group">
            <label for="nombreCompleto">Nombre completo:</label>
            <input type="text" id="nombreCompleto" required>
        </div>

        <div class="form-group">
            <label for="apodo">Apodo:</label>
            <input type="text" id="apodo" required>
        </div>

        <div class="form-group">
            <label for="nacionalidad">Nacionalidad:</label>
            <input type="text" id="nacionalidad" required>
        </div>

        <div class="form-group">
            <label for="estiloDeCombate">Estilo de combate:</label>
            <input type="text" id="estiloDeCombate" required>
        </div>

        <div class="form-group">
            <label for="base">Base:</label>
            <input type="text" id="base" required>
        </div>

        <div class="form-group">
            <label for="edad">Edad:</label>
            <input type="number" id="edad" min="1" required>
        </div>

        <div class="form-group">
            <label for="altura">Altura:</label>
            <input type="number" id="altura" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="alcance">Alcance:</label>
            <input type="number" id="alcance" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="ppv">PPV:</label>
            <input type="number" id="ppv" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label for="showPayment">Show Payment:</label>
            <input type="number" id="showPayment" min="0" required>
        </div>

        <div class="form-group">
            <label for="promotora">Promotora:</label>
            <input type="text" id="promotora" required>
        </div>

        <div class="form-group">
            <label for="record">Record:</label>
            <input type="text" id="record" placeholder="Ej. 17-1-0" required>
        </div>
        <div class="form-group">
            <label for="foto">Fotografia</label>
            <input type="file" id="foto" accept="image/png">
        </div>

        <button type="submit" id="btnSubmit">
            Registrar peleador
        </button>
        <button type="button" id="btnSubmit"
            onclick="history.back()">
            Volver atrás
        </button>
        <button type="button"
                id="btnCancel"
                class="btn-cancel"
                onclick="limpiarFormulario()">
            Cancelar edición
        </button>

    </form>

    <div id="status" class="status"></div>

    <!-- Tabla de peleadores -->

    <h2>Registro de peleadores</h2>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre completo</th>
                    <th>Apodo</th>
                    <th>Nacionalidad</th>
                    <th>Estilo</th>
                    <th>Base</th>
                    <th>Edad</th>
                    <th>Altura</th>
                    <th>Alcance</th>
                    <th>PPV</th>
                    <th>Show Payment</th>
                    <th>Promotora</th>
                    <th>Record</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody id="fighterTableBody">
            </tbody>

        </table>

    </div>

</div>
