    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/events.css">

    <style>
    </style>
</head>

<body>
<!-- Navigation-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light" id="navbar">
        <div class="container px-4 px-lg-5">
            <a class="navbar-brand" href="#!">Valhalla</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#!">About</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Fighters</a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#!">All Fighters</a></li>
                            <li><hr class="dropdown-divider" /></li>
                            <li><a class="dropdown-item" href="events.html">Eventos</a></li>
                            <li><a class="dropdown-item" href="#!">New Fighters</a></li>
                        </ul>
                    </li>
                </ul>
                <a href="crud.html"><button class="btn btn-outline-dark" type="submit">New Fighter</button></a>
            </div>
        </div>
    </nav>
<div class="container">

    <img src="images/valhalla.jpg"
         alt="Valhalla"
         class="logo"
         width="600">
    <h1>Registro del evento</h1>
    <form id="eventForm">

    <div class="form-group">
        <label for="eventName">Nombre del evento:</label>
        <input type="text" id="eventName" required>
    </div>

    <div class="form-group">
        <label for="eventDate">Fecha del evento:</label>
        <input type="date" id="eventDate" required>
    </div>

    <div class="form-group full">
        <label for="eventPlace">Lugar:</label>
        <input type="text" id="eventPlace" required>
    </div>

    <h2 class="full">Peleas de la cartelera</h2>

    <div id="fightsContainer" class="full"></div>

    <button type="button" id="btnAddFight" class="full" onclick="addFight()">
        + Agregar pelea
    </button>

    <button type="submit" id="btnSubmit">Registrar evento</button>
    <button type="button" id="btnCancel" class="btn-cancel" onclick="cancelEventEdit()"> Cancelar edición </button>
    <button type="button" class="btn-back" onclick="history.back()">
        Volver atrás
    </button>
    <input type="hidden" id="eventId">
    
</form>
<h2>Registro de eventos</h2>
<div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Evento</th>
                    <th>Fecha</th>
                    <th>Lugar</th>
                    <th>Peleas</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="eventTableBody"></tbody>
        </table>
</div>
<p id="status" class="status"></p>
    <footer class="text-center py-4">
        <p>VALHALLA © 2026 - ALL RIGHTS RESERVED</p>
    </footer>
<script src="js/events.js"></script>
</body>
</html>
